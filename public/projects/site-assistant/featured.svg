<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" fill="none">
  <title>Site assistant application stack</title>
  <desc>A Chat UI built with Astro, TypeScript and Tailwind connects to Cloudflare Pages Functions and D1. The backend uses Pinecone for hybrid retrieval, OpenRouter for decisions and generation, and a dotted connection labeled best-effort tracing for LangSmith.</desc>
