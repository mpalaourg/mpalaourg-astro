<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title description">
<title id="title">From source documents to retrieval records</title><desc id="description">HTML, PDF and PPTX sources are extracted before deployment, split into parent chunks and smaller passages, and stored in D1 and Pinecone with shared identities and version metadata.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#c2410c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="gray-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#475569" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1200" height="570" rx="16" fill="#ffffff"/>
<g font-family="DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="40" y="47" font-size="27" fill="#0f172a" font-weight="650" text-anchor="start">From source documents to retrieval records</text>
<rect x="40" y="95" width="205" height="165" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="60" y="130" font-size="24" fill="#0f172a" font-weight="650" text-anchor="start">Sources</text><text x="60" y="161" font-size="19" fill="#475569" font-weight="400" text-anchor="start">HTML pages</text><text x="60" y="188" font-size="19" fill="#475569" font-weight="400" text-anchor="start">PDF documents</text><text x="60" y="215" font-size="19" fill="#475569" font-weight="400" text-anchor="start">PPTX slides</text>
<rect x="310" y="95" width="255" height="165" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="330" y="130" font-size="24" fill="#0f172a" font-weight="650" text-anchor="start">Extract text</text><text x="330" y="161" font-size="19" fill="#475569" font-weight="400" text-anchor="start">HTML editorial text</text><text x="330" y="188" font-size="19" fill="#475569" font-weight="400" text-anchor="start">Docling page text</text><text x="330" y="215" font-size="19" fill="#475569" font-weight="400" text-anchor="start">Visible slide text</text>
<rect x="630" y="95" width="245" height="165" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/><text x="650" y="130" font-size="24" fill="#0f172a" font-weight="650" text-anchor="start">Parent chunks</text><text x="650" y="161" font-size="19" fill="#475569" font-weight="400" text-anchor="start">Source context</text><text x="650" y="188" font-size="19" fill="#475569" font-weight="400" text-anchor="start">Page / slide location</text><text x="650" y="215" font-size="19" fill="#475569" font-weight="400" text-anchor="start">Source identity</text>
<path d="M245 178H298" fill="none" stroke="#c2410c" stroke-width="2"  marker-end="url(#arrow)"/>
<path d="M565 178H618" fill="none" stroke="#c2410c" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="940" y="95" width="220" height="165" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="960" y="130" font-size="24" fill="#0f172a" font-weight="650" text-anchor="start">D1 corpus</text><text x="960" y="161" font-size="19" fill="#475569" font-weight="400" text-anchor="start">Canonical text</text><text x="960" y="188" font-size="19" fill="#475569" font-weight="400" text-anchor="start">Citation URLs</text><text x="960" y="215" font-size="19" fill="#475569" font-weight="400" text-anchor="start">Source metadata</text>
<path d="M875 178H928" fill="none" stroke="#c2410c" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="630" y="340" width="245" height="128" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="650" y="375" font-size="24" fill="#0f172a" font-weight="650" text-anchor="start">Child passages</text><text x="650" y="406" font-size="19" fill="#475569" font-weight="400" text-anchor="start">Smaller inputs</text><text x="650" y="433" font-size="19" fill="#475569" font-weight="400" text-anchor="start">Linked to parent IDs</text>
<path d="M752 260V328" fill="none" stroke="#c2410c" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="940" y="340" width="220" height="128" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="960" y="375" font-size="24" fill="#0f172a" font-weight="650" text-anchor="start">Pinecone</text><text x="960" y="406" font-size="19" fill="#475569" font-weight="400" text-anchor="start">Multilingual vectors</text><text x="960" y="433" font-size="19" fill="#475569" font-weight="400" text-anchor="start">BM25 title + body</text>
<path d="M875 402H928" fill="none" stroke="#c2410c" stroke-width="2"  marker-end="url(#arrow)"/>
<text x="40" y="344" font-size="21" fill="#0f172a" font-weight="650" text-anchor="start">Shared provenance</text>
<text x="40" y="380" font-size="19" fill="#475569" font-weight="400" text-anchor="start">Language · Document type · Section</text>
<text x="40" y="411" font-size="19" fill="#475569" font-weight="400" text-anchor="start">Source checksum · Corpus version</text>
<path d="M40 503H1160" fill="none" stroke="#94a3b8" stroke-width="1.5" />
<text x="40" y="540" font-size="21" fill="#475569" font-weight="400" text-anchor="start">Preparation happens before deployment; requests retrieve prepared text.</text>
</g></svg>
