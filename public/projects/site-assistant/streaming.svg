<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
<title id="title">Streaming, validation and persistence</title><desc id="description">A browser submits a question to the API, which requests model inference. Structured model chunks become answer previews. The API validates the completed output, persists it in D1, and only then sends the completed reply with citations and model attribution. Vertical spacing illustrates event order.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#c2410c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="gray-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#475569" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1200" height="620" rx="16" fill="#ffffff"/>
<g font-family="DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="40" y="47" font-size="27" fill="#0f172a" font-weight="650" text-anchor="start">Streaming, validation and persistence</text>
<text x="150" y="101" font-size="23" fill="#0f172a" font-weight="650" text-anchor="middle">Browser</text>
<text x="450" y="101" font-size="23" fill="#0f172a" font-weight="650" text-anchor="middle">Chat API</text>
<text x="750" y="101" font-size="23" fill="#0f172a" font-weight="650" text-anchor="middle">Model</text>
<text x="1050" y="101" font-size="23" fill="#0f172a" font-weight="650" text-anchor="middle">D1</text>
<path d="M150 119V545" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 7"/>
<path d="M450 119V545" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 7"/>
<path d="M750 119V545" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 7"/>
<path d="M1050 119V545" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 7"/>
<path d="M150 158H438" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#gray-arrow)"/>
<text x="300" y="144" font-size="19" fill="#475569" font-weight="400" text-anchor="middle">POST question</text>
<path d="M450 213H738" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#gray-arrow)"/>
<text x="600" y="199" font-size="19" fill="#475569" font-weight="400" text-anchor="middle">Inference request</text>
<path d="M750 268H462" fill="none" stroke="#c2410c" stroke-width="2"  marker-end="url(#arrow)"/>
<text x="600" y="254" font-size="19" fill="#c2410c" font-weight="400" text-anchor="middle">Structured chunks</text>
<path d="M450 323H162" fill="none" stroke="#c2410c" stroke-width="2"  marker-end="url(#arrow)"/>
<text x="300" y="309" font-size="19" fill="#c2410c" font-weight="400" text-anchor="middle">Answer previews</text>
<rect x="325" y="350" width="250" height="42" rx="8" fill="#fff7ed" stroke="#fdba74"/>
<text x="450" y="378" font-size="17" fill="#0f172a" font-weight="650" text-anchor="middle">Validate completed output</text>
<path d="M450 429H1038" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#gray-arrow)"/>
<text x="750" y="415" font-size="19" fill="#475569" font-weight="400" text-anchor="middle">Persist completed reply</text>
<path d="M1050 479H462" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#gray-arrow)"/>
<text x="750" y="465" font-size="19" fill="#475569" font-weight="400" text-anchor="middle">Saved</text>
<path d="M450 529H162" fill="none" stroke="#c2410c" stroke-width="2"  marker-end="url(#arrow)"/>
<text x="300" y="515" font-size="18" fill="#c2410c" font-weight="400" text-anchor="middle">Final reply + references</text>
<path d="M40 567H1160" fill="none" stroke="#94a3b8" stroke-width="1.5" />
<text x="40" y="602" font-size="19" fill="#475569" font-weight="400" text-anchor="start">Events follow their own conversation from submission to saved reply.</text>
</g></svg>
